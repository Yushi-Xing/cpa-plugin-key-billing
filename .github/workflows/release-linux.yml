name: Publish verified Linux release

on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful Linux routing validation run ID to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-linux
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful validation of the source and both architectures
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          gh api "repos/$REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads(Path(os.environ['RUNNER_TEMP']+'/validation.json').read_text())
          assert run['status']=='completed' and run['conclusion']=='success', 'Validation has not passed'
          assert run['path']=='.github/workflows/linux-routing.yml', 'Unexpected validation workflow'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.validated.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run }}
          pattern: key-billing-linux-*
          path: ${{ runner.temp }}/libraries
      - name: Package tested libraries and create annotated version tag
        env:
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          version="$(awk -F'"' '/^[[:space:]]*Version[[:space:]]*=/ {print $2; exit}' internal/plugin/types.go)"
          test -n "$version"
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then echo "Tag already exists: $tag"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/release"
          for arch in amd64 arm64; do
            library="$RUNNER_TEMP/libraries/key-billing-linux-$arch/cpa-key-billing.so"
            test -s "$library"
            tar -czf "$RUNNER_TEMP/release/cpa-key-billing_${version}_linux_${arch}.tar.gz" -C "$(dirname "$library")" cpa-key-billing.so
            zip -j "$RUNNER_TEMP/release/cpa-key-billing_${version}_linux_${arch}.zip" "$library"
          done
          cd "$RUNNER_TEMP/release"
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" "$VALIDATED_SHA" -m "Release $tag: permission filtering before credential priority"
          git push origin "$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' Changelog.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          printf '\n验证构建：https://github.com/%s/actions/runs/%s\n' "$REPOSITORY" "$VALIDATION_RUN" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "$RELEASE_TAG Linux routing fix" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release/"*
